name: Code Metrics - Radon & Mutmut

on:
  workflow_dispatch:

jobs:
  code-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest torch radon mutmut

      - name: Run Radon - Cyclomatic Complexity
        run: |
          {
            echo "=== Cyclomatic Complexity ==="
            radon cc backend model-development -s
          } | tee -a code-metrics-report.txt

      - name: Run Radon - Maintainability Index
        run: |
          {
            echo "=== Maintainability Index ==="
            radon mi backend model-development -s
          } | tee -a code-metrics-report.txt

      - name: Run Radon - Raw Metrics
        run: |
          {
            echo "=== Raw Metrics ==="
            radon raw backend model-development -s
          } | tee -a code-metrics-report.txt

      - name: Run Mutmut
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          {
            echo "=== Mutation Testing Run ==="
            mutmut run "backend.inference.yolo_service.*" || true
          } | tee -a code-metrics-report.txt

      - name: Export Mutation Results
        run: |
          {
            echo "=== Mutation Testing Results ==="
            mutmut results || true
          } | tee -a code-metrics-report.txt

      - name: Upload Code Metrics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics-report
          path: code-metrics-report.txt
          if-no-files-found: error
